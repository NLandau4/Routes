<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 300' width='720' height='300'><rect width='720' height='300' fill='#FFFFFF'/><defs><marker id='ah' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0 0 L8 4 L0 8 z' fill='#0E1116'/></marker></defs><rect x='20' y='20' width='200' height='48' rx='10' fill='#F4F5F7' stroke='#0E1116' stroke-width='1.5'/><text x='120.0' y='41.0' font-family='Instrument Sans, Helvetica Neue, Arial, sans-serif' font-size='13' font-weight='500' fill='#0E1116' text-anchor='middle'>Day 1–30</text><text x='120.0' y='58.0' font-family='Instrument Sans, Helvetica Neue, Arial, sans-serif' font-size='13' font-weight='500' fill='#0E1116' text-anchor='middle'>You make purchases</text><line x1='220' y1='44' x2='262' y2='44' stroke='#0E1116' stroke-width='2' marker-end='url(#ah)'/><rect x='262' y='20' width='200' height='48' rx='10' fill='#FFD100' stroke='#0E1116' stroke-width='1.5'/><text x='362.0' y='41.0' font-family='Instrument Sans, Helvetica Neue, Arial, sans-serif' font-size='13' font-weight='700' fill='#0E1116' text-anchor='middle'>Statement closes</text><text x='362.0' y='58.0' font-family='Instrument Sans, Helvetica Neue, Arial, sans-serif' font-size='13' font-weight='700' fill='#0E1116' text-anchor='middle'>Balance: $600</text><line x1='462' y1='44' x2='504' y2='44' stroke='#0E1116' stroke-width='2' marker-end='url(#ah)'/><rect x='504' y='20' width='196' height='48' rx='10' fill='#fff' stroke='#0E1116' stroke-width='1.5'/><text x='602.0' y='41.0' font-family='Instrument Sans, Helvetica Neue, Arial, sans-serif' font-size='13' font-weight='500' fill='#0E1116' text-anchor='middle'>Due date, ~3 weeks later</text><text x='602.0' y='58.0' font-family='Instrument Sans, Helvetica Neue, Arial, sans-serif' font-size='13' font-weight='500' fill='#0E1116' text-anchor='middle'>Did you pay all $600?</text><line x1='560' y1='68' x2='420' y2='120' stroke='#0E1116' stroke-width='2' marker-end='url(#ah)'/><text x='496.0' y='88.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' font-weight='700' fill='#0E1116'>YES, IN FULL</text><line x1='650' y1='68' x2='650' y2='120' stroke='#0E1116' stroke-width='2' marker-end='url(#ah)'/><text x='600' y='100' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' font-weight='700' fill='#0E1116'>NO, PAID $25</text><rect x='280' y='120' width='280' height='56' rx='10' fill='#E8F5EE' stroke='#1F9D5A' stroke-width='1.5'/><text x='420.0' y='145.0' font-family='Instrument Sans, Helvetica Neue, Arial, sans-serif' font-size='13' font-weight='500' fill='#0E1116' text-anchor='middle'>$0 interest. The three weeks were</text><text x='420.0' y='162.0' font-family='Instrument Sans, Helvetica Neue, Arial, sans-serif' font-size='13' font-weight='500' fill='#0E1116' text-anchor='middle'>free. Next month starts clean.</text><rect x='580' y='120' width='130' height='56' rx='10' fill='#FDECEB' stroke='#E8322B' stroke-width='1.5'/><text x='645.0' y='145.0' font-family='Instrument Sans, Helvetica Neue, Arial, sans-serif' font-size='12' font-weight='500' fill='#0E1116' text-anchor='middle'>Interest charged</text><text x='645.0' y='162.0' font-family='Instrument Sans, Helvetica Neue, Arial, sans-serif' font-size='12' font-weight='500' fill='#0E1116' text-anchor='middle'>on the $575 left</text><line x1='650' y1='176' x2='650' y2='206' stroke='#0E1116' stroke-width='2' marker-end='url(#ah)'/><rect x='440' y='206' width='270' height='70' rx='10' fill='#FDECEB' stroke='#E8322B' stroke-width='1.5'/><text x='575.0' y='222.0' font-family='Instrument Sans, Helvetica Neue, Arial, sans-serif' font-size='12' font-weight='500' fill='#0E1116' text-anchor='middle'>And the grace period is gone:</text><text x='575.0' y='239.0' font-family='Instrument Sans, Helvetica Neue, Arial, sans-serif' font-size='12' font-weight='500' fill='#0E1116' text-anchor='middle'>next month's new purchases accrue</text><text x='575.0' y='256.0' font-family='Instrument Sans, Helvetica Neue, Arial, sans-serif' font-size='12' font-weight='500' fill='#0E1116' text-anchor='middle'>interest from the day you buy,</text><text x='575.0' y='273.0' font-family='Instrument Sans, Helvetica Neue, Arial, sans-serif' font-size='12' font-weight='500' fill='#0E1116' text-anchor='middle'>until you pay in full again.</text><text x='20' y='230' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' fill='#5B6472'>THE GRACE PERIOD ONLY EXISTS IF LAST</text><text x='20' y='244' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' fill='#5B6472'>MONTH WAS PAID IN FULL. ONE PARTIAL</text><text x='20' y='258' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' fill='#5B6472'>PAYMENT TURNS IT OFF.</text></svg>