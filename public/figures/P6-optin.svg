<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 320' width='720' height='320'><rect width='720' height='320' fill='#FFFFFF'/><defs><marker id='ah' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0 0 L8 4 L0 8 z' fill='#0E1116'/></marker></defs><rect x='230' y='16' width='260' height='52' rx='10' fill='#FFD100' stroke='#0E1116' stroke-width='1.5'/><text x='360.0' y='39.0' font-family='Instrument Sans, Helvetica Neue, Arial, sans-serif' font-size='13' font-weight='700' fill='#0E1116' text-anchor='middle'>You swipe. The account</text><text x='360.0' y='56.0' font-family='Instrument Sans, Helvetica Neue, Arial, sans-serif' font-size='13' font-weight='700' fill='#0E1116' text-anchor='middle'>has $4 in it. The charge is $12.</text><line x1='360' y1='68' x2='360' y2='96' stroke='#0E1116' stroke-width='2' marker-end='url(#ah)'/><rect x='260' y='96' width='200' height='44' rx='10' fill='#fff' stroke='#0E1116' stroke-width='1.5'/><text x='360.0' y='115.0' font-family='Instrument Sans, Helvetica Neue, Arial, sans-serif' font-size='13' font-weight='500' fill='#0E1116' text-anchor='middle'>Are you opted in to</text><text x='360.0' y='132.0' font-family='Instrument Sans, Helvetica Neue, Arial, sans-serif' font-size='13' font-weight='500' fill='#0E1116' text-anchor='middle'>overdraft coverage?</text><line x1='260' y1='118' x2='150' y2='160' stroke='#0E1116' stroke-width='2' marker-end='url(#ah)'/><text x='211.0' y='133.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' font-weight='700' fill='#0E1116'>NO</text><line x1='460' y1='118' x2='570' y2='160' stroke='#0E1116' stroke-width='2' marker-end='url(#ah)'/><text x='521.0' y='133.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' font-weight='700' fill='#0E1116'>YES</text><rect x='30' y='160' width='240' height='60' rx='10' fill='#E8F5EE' stroke='#1F9D5A' stroke-width='1.5'/><text x='150.0' y='179.0' font-family='Instrument Sans, Helvetica Neue, Arial, sans-serif' font-size='13' font-weight='500' fill='#0E1116' text-anchor='middle'>Card declines.</text><text x='150.0' y='196.0' font-family='Instrument Sans, Helvetica Neue, Arial, sans-serif' font-size='13' font-weight='500' fill='#0E1116' text-anchor='middle'>You pay with something else.</text><text x='150.0' y='213.0' font-family='Instrument Sans, Helvetica Neue, Arial, sans-serif' font-size='13' font-weight='500' fill='#0E1116' text-anchor='middle'>Cost: $0.</text><rect x='450' y='160' width='240' height='60' rx='10' fill='#FDECEB' stroke='#E8322B' stroke-width='1.5'/><text x='570.0' y='179.0' font-family='Instrument Sans, Helvetica Neue, Arial, sans-serif' font-size='13' font-weight='500' fill='#0E1116' text-anchor='middle'>Bank covers it.</text><text x='570.0' y='196.0' font-family='Instrument Sans, Helvetica Neue, Arial, sans-serif' font-size='13' font-weight='500' fill='#0E1116' text-anchor='middle'>Balance goes to -$8,</text><text x='570.0' y='213.0' font-family='Instrument Sans, Helvetica Neue, Arial, sans-serif' font-size='13' font-weight='500' fill='#0E1116' text-anchor='middle'>then a $35 fee: -$43.</text><line x1='570' y1='220' x2='570' y2='250' stroke='#0E1116' stroke-width='2' marker-end='url(#ah)'/><rect x='430' y='250' width='280' height='56' rx='10' fill='#FDECEB' stroke='#E8322B' stroke-width='1.5'/><text x='570.0' y='267.0' font-family='Instrument Sans, Helvetica Neue, Arial, sans-serif' font-size='12' font-weight='500' fill='#0E1116' text-anchor='middle'>Paycheck lands. Bank takes the</text><text x='570.0' y='284.0' font-family='Instrument Sans, Helvetica Neue, Arial, sans-serif' font-size='12' font-weight='500' fill='#0E1116' text-anchor='middle'>$43 first. Any other charges</text><text x='570.0' y='301.0' font-family='Instrument Sans, Helvetica Neue, Arial, sans-serif' font-size='12' font-weight='500' fill='#0E1116' text-anchor='middle'>before then: another fee each.</text><text x='30' y='292' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' fill='#5B6472'>A THIRD OPTION SOME BANKS OFFER: A TRANSFER FROM</text><text x='30' y='306' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' fill='#5B6472'>LINKED SAVINGS, USUALLY FREE OR A SMALL FEE.</text></svg>